<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vanguard CRM</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<meta name="theme-color" content="#111A2B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --soft:#F3F5F8; --line:#E3E7ED; --line2:#D2D8E1;
  --text:#111827; --text2:#3E4757; --muted:#6B7384;
  --accent:#2B4A70; --accent-soft:#E7EFF9; --on-accent:#FFFFFF;
  --danger:#C8303A; --ok:#1F8A4C; --warn:#A16207;
  --s1:#3B82F6; --s2:#CBD3DF; --s3:#1baf7a;
  --shadow:0 1px 3px rgba(17,24,39,.06);
  --r:14px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#050506; --card:#0E0F12; --soft:#15171B; --line:#24272D; --line2:#33373F;
  --text:#F5F7FA; --text2:#C9CED6; --muted:#8A919C;
  --accent:#FFFFFF; --accent-soft:rgba(255,255,255,.10); --on-accent:#0A0B0D;
  --danger:#FF5C6C; --ok:#4BE3A0; --warn:#FFC857;
  --s1:#F5F7FA; --s2:#6FD3FF; --s3:#9AA3AF;
  --glow:0 0 0 1px rgba(255,255,255,.55),0 0 18px rgba(255,255,255,.35);
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:flex;min-height:100vh}
.side{width:232px;flex:none;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column}
.logo{font-weight:700;font-size:17px;letter-spacing:-.01em;padding:4px 10px 18px;display:flex;align-items:center;gap:10px}
.logo i{width:28px;height:28px;border-radius:7px;background:var(--accent);display:inline-grid;place-items:center;color:var(--card);font-style:normal;font-size:14px;font-weight:800}
.logo small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
.nav .grp{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--text2);font-weight:500;font-size:14.5px;margin-bottom:1px}
.nav a:hover{background:var(--soft);color:var(--text)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:0 28px;height:64px;border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:20}
.top h1{font-size:18px;font-weight:650;margin:0;letter-spacing:-.01em;flex:1}
.who{font-size:13px;color:var(--muted);text-align:right;line-height:1.35}
.who b{color:var(--text);font-weight:600}
.iconbtn{border:1px solid var(--line);background:var(--card);width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--text2)}
.iconbtn:hover{background:var(--soft)}
.burger{display:none}
.view{padding:24px 28px 64px;max-width:1600px;width:100%}
.btn{border:1px solid var(--line2);border-radius:8px;padding:8px 14px;font-weight:550;font-size:14.5px;background:var(--card);color:var(--text);display:inline-flex;align-items:center;gap:7px;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{filter:brightness(1.07);background:var(--accent)}
.btn.big{padding:10px 18px;font-size:15px;min-height:42px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{background:transparent;border-color:transparent;color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:13.5px;min-height:32px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.muted{color:var(--muted)} .small{font-size:13.5px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums;font-weight:650}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:6px;background:var(--soft);font-size:12.5px;font-weight:550;color:var(--text2);border:1px solid var(--line)}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.input,.select,textarea.input{width:100%;border:1px solid var(--line2);background:var(--card);border-radius:8px;padding:9px 12px;outline:none;min-height:42px}
.input:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.input:disabled{background:var(--soft);color:var(--muted)}
.select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--text2);margin:0 0 6px}
.field{margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 16px}
.seg{display:inline-flex;flex-wrap:wrap;gap:0;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;border-left:1px solid var(--line2);background:transparent;padding:8px 14px;font-weight:550;color:var(--text2);min-height:40px;font-size:14.5px}
.seg button:first-child{border-left:0}
.seg button:hover{background:var(--soft)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.seg.status{display:flex;border:0;gap:8px;overflow:visible;background:none}
.seg.status button{border:1px solid var(--line2);border-radius:8px;display:inline-flex;align-items:center;gap:8px}
.seg.status button.on{background:var(--card);color:var(--text);border-color:var(--sc);box-shadow:0 0 0 1px var(--sc) inset;font-weight:650}
.seg.status button.on:hover{background:var(--card)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .input,.toolbar .select{width:auto;min-height:38px;padding:7px 11px;font-size:14.5px}
.toolbar .select{padding-right:32px}
.tabs{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;background:var(--card)}
.tabs button{border:0;border-left:1px solid var(--line2);background:transparent;padding:7px 13px;font-weight:550;color:var(--text2);font-size:14px}
.tabs button:first-child{border-left:0}
.tabs button.on{background:var(--soft);color:var(--text);font-weight:650}
/* board */
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:16px;scroll-snap-type:x proximity;align-items:flex-start}
.col{flex:1 1 0;min-width:190px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px;scroll-snap-align:start;min-height:180px;transition:background .15s}
.col.drop{background:var(--accent-soft);border-color:var(--accent)}
.colh{display:flex;align-items:center;gap:8px;padding:4px 4px 10px;font-weight:650;font-size:14px}
.colh .cnt{margin-left:auto;color:var(--muted);font-weight:600;font-size:12.5px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.colsum{font-size:12.5px;color:var(--muted);padding:0 4px 10px;margin-top:-6px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px 14px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.kcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
.kcard:hover{border-color:var(--line2);box-shadow:0 2px 8px rgba(17,24,39,.06)}
.kcard.dragging{opacity:.4}
.kcard .nm{font-weight:650;font-size:15px;margin-bottom:6px;display:flex;gap:8px;align-items:flex-start}
.kcard .nm span{flex:1}
.kcard .meta{font-size:13px;color:var(--text2);line-height:1.6}
.kcard .tot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.kcard .tot b{font-size:17px;font-variant-numeric:tabular-nums;font-weight:700}
.badge{font-size:11.5px;font-weight:650;padding:1px 7px;border-radius:5px;background:var(--soft);border:1px solid var(--line);color:var(--text2);white-space:nowrap}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16.5px;margin-bottom:6px;font-weight:650}
/* table */
.tablewrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
table.t{border-collapse:collapse;width:100%;font-size:14px}
.t th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:11px 12px;white-space:nowrap;position:sticky;top:0;background:var(--soft);border-bottom:1px solid var(--line)}
.t td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
.t tbody tr:first-child td{border-top:0}
.t td.r,.t th.r{text-align:right;font-variant-numeric:tabular-nums}
.t tr.click{cursor:pointer}
.t tr.click:hover td{background:var(--soft)}
.t tfoot td{font-weight:700;border-top:1px solid var(--line2);background:var(--soft)}
.t tr.sub td{background:var(--soft);font-size:13px;color:var(--text2)}
/* kpi */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .v{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi.hero{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.kpi.hero .v{color:var(--accent)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.chartbox h3{margin:0 0 2px;font-size:15px;font-weight:650}
.chartbox .cv{position:relative;height:260px;margin-top:10px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(10,14,22,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;overflow:auto;z-index:50}
.modal{background:var(--card);border-radius:14px;width:100%;max-width:680px;box-shadow:0 24px 64px rgba(0,0,0,.22);display:flex;flex-direction:column;max-height:90vh;border:1px solid var(--line)}
.modal.wide{max-width:960px}
.modal.narrow{max-width:440px}
.mh{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;font-size:18px;font-weight:650;flex:1}
.mb{padding:18px 22px;overflow:auto}
.mf{padding:12px 22px;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--soft);border-radius:0 0 14px 14px}
.calc{border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:14px 16px;margin-top:6px}
.calc h4{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cl{display:flex;justify-content:space-between;gap:12px;padding:3px 0;font-size:14.5px}
.cl span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.cl.tot{border-top:1px solid var(--line2);margin-top:8px;padding-top:10px;font-size:16px;font-weight:650}
.cl.tot span:last-child{font-weight:800;font-size:22px;color:var(--accent)}
.note{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--card));color:var(--text);border-radius:8px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.info{border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--accent-soft);border-radius:8px;padding:9px 12px;font-size:13.5px;margin:10px 0}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:80;width:min(92vw,440px)}
.toast{background:#111A2B;color:#fff;border-radius:10px;padding:11px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 8px 28px rgba(0,0,0,.25);font-size:14.5px}
:root[data-theme="dark"] .toast{background:#F3F4F6;color:#111827}
.toast button{margin-left:auto;border:0;background:transparent;color:#9DBBFF;font-weight:700}
:root[data-theme="dark"] .toast button{color:#1F4FD1}
.list .item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.list .item:first-child{border-top:0}
.ratesgrid{display:grid;grid-template-columns:110px repeat(3,1fr);gap:8px 12px;align-items:center}
.ratesgrid .input{min-height:38px;padding:6px 10px}
.pct{display:flex;align-items:center;gap:6px}
.pct .input{width:84px;min-height:38px;padding:6px 10px}
.check{display:flex;gap:9px;align-items:center;font-weight:500;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.loading{padding:80px 20px;text-align:center;color:var(--muted)}
.hide{display:none!important}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.emp .nm{font-weight:650;font-size:16px}
.sectiontitle{font-size:15px;font-weight:650;margin:24px 0 10px}
/* schedule */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.day{border-left:1px solid var(--line);min-height:220px;display:flex;flex-direction:column}
.day:first-child{border-left:0}
.dayh{padding:10px 10px 8px;border-bottom:1px solid var(--line);background:var(--soft);display:flex;align-items:baseline;gap:6px}
.dayh b{font-size:18px;font-weight:700}
.dayh span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.day.today .dayh{background:var(--accent-soft)}
.day.today .dayh b{color:var(--accent)}
.dayb{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.dayb .add{margin-top:auto;border:1px dashed var(--line2);background:transparent;border-radius:8px;color:var(--muted);font-size:13px;padding:5px;opacity:0;transition:opacity .15s}
.day:hover .add{opacity:1}
.ev{border:1px solid var(--line);border-left:3px solid var(--ec);border-radius:7px;padding:6px 8px;font-size:12.5px;line-height:1.35;cursor:pointer;background:color-mix(in srgb,var(--ec) 6%,var(--card))}
.ev:hover{border-color:var(--line2)}
.ev .tm{font-weight:700;font-variant-numeric:tabular-nums}
.ev .ty{color:var(--muted)}
.ev .who2{color:var(--text2)}
.ev.conf{box-shadow:0 0 0 1px var(--danger) inset}
.ev.free{border-style:dashed;border-left-style:solid;background:transparent}
.ev.free .ty{color:var(--ok);font-weight:600}
.dayb .row .add{opacity:0}
.day:hover .dayb .row .add{opacity:1}

.modal{overflow:hidden}
.modal>div[id]{display:flex;flex-direction:column;min-height:0;flex:1}
.mb{flex:1;min-height:0}
/* ---- неоновая ночная тема ---- */
:root[data-theme="dark"] body{background:
  radial-gradient(900px 500px at 85% -10%,rgba(255,255,255,.16),transparent 60%),
  radial-gradient(700px 500px at -10% 110%,rgba(255,255,255,.04),transparent 60%),#050506;background-attachment:fixed}
:root[data-theme="dark"] .side,:root[data-theme="dark"] .top{background:rgba(8,9,11,.82);backdrop-filter:blur(10px);border-color:var(--line)}
:root[data-theme="dark"] .logo i{background:#FFFFFF;color:#0A0B0D;box-shadow:0 0 16px rgba(255,255,255,.7)}
:root[data-theme="dark"] .logo{text-shadow:0 0 14px rgba(255,255,255,.45)}
:root[data-theme="dark"] .nav a.on{background:rgba(255,255,255,.14);color:#FFFFFF;box-shadow:inset 2px 0 0 #FFFFFF,0 0 14px rgba(255,255,255,.18)}
:root[data-theme="dark"] .nav a.on svg{filter:drop-shadow(0 0 4px #FFFFFF)}
:root[data-theme="dark"] .top h1{text-shadow:0 0 18px rgba(255,255,255,.35)}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .seg button.on{background:#FFFFFF;border-color:transparent;color:#0A0B0D;box-shadow:var(--glow)}
:root[data-theme="dark"] .btn.pri:hover{box-shadow:0 0 0 1px #fff,0 0 26px rgba(255,255,255,.55)}
:root[data-theme="dark"] .card,:root[data-theme="dark"] .kpi,:root[data-theme="dark"] .chartbox,:root[data-theme="dark"] .tablewrap,:root[data-theme="dark"] .week,:root[data-theme="dark"] .modal{background:rgba(14,15,18,.88);border-color:var(--line)}
:root[data-theme="dark"] .kpi.hero{border-color:#FFFFFF;box-shadow:var(--glow)}
:root[data-theme="dark"] .kpi.hero .v,:root[data-theme="dark"] .cl.tot span:last-child{color:#FFFFFF;text-shadow:0 0 14px rgba(255,255,255,.7)}
:root[data-theme="dark"] .col{background:rgba(21,23,27,.7)}
:root[data-theme="dark"] .col.drop{box-shadow:var(--glow)}
:root[data-theme="dark"] .kcard{background:#101114}
:root[data-theme="dark"] .kcard:before{box-shadow:0 0 10px var(--sc)}
:root[data-theme="dark"] .kcard:hover{border-color:#4A4F58;box-shadow:0 0 16px rgba(255,255,255,.25)}
:root[data-theme="dark"] .kcard .tot b{color:#FFFFFF}
:root[data-theme="dark"] .dot{box-shadow:0 0 6px currentColor}
:root[data-theme="dark"] .input:focus,:root[data-theme="dark"] .select:focus{border-color:#FFFFFF;box-shadow:0 0 0 3px rgba(255,255,255,.2),0 0 14px rgba(255,255,255,.3)}
:root[data-theme="dark"] .input,:root[data-theme="dark"] .select{background-color:#0B0C0E}
:root[data-theme="dark"] .t th,:root[data-theme="dark"] .t tfoot td,:root[data-theme="dark"] .mf,:root[data-theme="dark"] .dayh,:root[data-theme="dark"] .calc{background:#121317}
:root[data-theme="dark"] .day.today .dayh{background:rgba(255,255,255,.18)}
:root[data-theme="dark"] .day.today .dayh b{color:#FFFFFF;text-shadow:0 0 10px #FFFFFF}
:root[data-theme="dark"] .ev{background:color-mix(in srgb,var(--ec) 10%,#0E0F12);box-shadow:-2px 0 10px -4px var(--ec)}
:root[data-theme="dark"] .seg.status button.on{background:#101114;color:#fff;box-shadow:0 0 0 1px var(--sc) inset,0 0 12px color-mix(in srgb,var(--sc) 60%,transparent)}
:root[data-theme="dark"] .chip.acc{background:rgba(255,255,255,.16);color:#FFFFFF}
:root[data-theme="dark"] .toast{background:#111215;color:#F1ECFF;border:1px solid #3A3E46;box-shadow:0 0 22px rgba(255,255,255,.35)}
:root[data-theme="dark"] .toast button{color:#FFFFFF}
:root[data-theme="dark"] .ov{background:rgba(2,2,3,.72);backdrop-filter:blur(3px)}
:root[data-theme="dark"] .modal{box-shadow:0 0 0 1px #2E3138,0 0 40px rgba(255,255,255,.25)}
:root[data-theme="dark"] a{color:#FFFFFF}
:root[data-theme="dark"] .iconbtn{background:#0E0F12}
:root[data-theme="dark"] .iconbtn:hover{box-shadow:var(--glow);color:#fff}
:root[data-theme="dark"] input[type=date],:root[data-theme="dark"] input[type=time],:root[data-theme="dark"] input[type=month]{color-scheme:dark}

/* ---- обои ---- */
:root{--wall-ov:rgba(243,245,248,.9);--glass:#FFFFFF}
:root[data-theme="dark"]{--wall-ov:rgba(4,4,6,.70);--glass:rgba(8,9,11,.80)}
:root[data-theme="dark"],:root[data-theme="dark"] body{background:transparent}
:root[data-theme="dark"] body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--wall-ov),var(--wall-ov)),url(assets/bg.jpg) center/cover no-repeat #050506}
:root[data-theme="dark"] body{background:transparent}
.side,.top{background:var(--glass)!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

<script id="logic">
/* ===== Чистая логика расчёта (без интерфейса) ===== */
const CITIES=[{id:'astana',name:'Астана'},{id:'almaty',name:'Алматы'},{id:'shymkent',name:'Шымкент'}];
const CITY_NAME={astana:'Астана',almaty:'Алматы',shymkent:'Шымкент',general:'Общий'};
const ROLES=[{id:'teacher',name:'Учитель'},{id:'tech',name:'Тех специалист'},{id:'sales',name:'Продажник'},{id:'owner',name:'Тренер'}];
const ROLE_NAME={teacher:'Учитель',tech:'Тех специалист',sales:'Продажа',extra:'Доплата',owner:'Тренер'};
const EXAMS=['TOEFL iBT','Duolingo','IELTS','Другое'];
const ADDONS=[{id:'none',name:'Нет'},{id:'paid',name:'Пересдача платная'},{id:'free',name:'Пересдача бесплатная'}];
const DEFAULT_RATES={astana:{teacher:10,tech:20,sales:10},almaty:{teacher:25,tech:25,sales:10},shymkent:{teacher:10,tech:25,sales:10}};
const RATE_HINTS={astana:{teacher:'обычно 10%',tech:'20% (или 10% для второго тех специалиста)'},almaty:{teacher:'25% (или 10%)',tech:'обычно 25%'},shymkent:{teacher:'обычно 10%',tech:'обычно 25%'}};
const DEFAULT_STATUSES=[
  {id:'bron',name:'Бронь',color:'#7DCB8E'},
  {id:'offered',name:'Дата предложена',color:'#E9B949'},
  {id:'process',name:'Дата утверждена',color:'#2F6FE4'},
  {id:'retake',name:'Пересдача',color:'#A08CD8'},
  {id:'closed',name:'Закрытая сделка',color:'#0F766E'}];
const LEGACY_STATUS={excellent:'closed',refund:'closed'};
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

function num(v){if(v===null||v===undefined||v==='')return 0;const n=Number(String(v).replace(/[\s  ₸%]/g,'').replace(',','.'));return isFinite(n)?n:0}
function pad(n){return String(n).padStart(2,'0')}
function isoDate(y,m,d){return y+'-'+pad(m)+'-'+pad(d)}

/* Расчёт по клиенту — строго по ТЗ, п. 6 */
function calcClient(c){
  const cost=Math.round(num(c.cost));
  const pct=num(c.paidPct);
  const paid=Math.round(cost*pct/100);
  const fee=c.retake&&c.retake.kind==='paid'?Math.round(num(c.retake.fee)):0;
  const refund=Math.round(num(c.refund));
  const revenue=Math.max(0,paid+fee-refund);
  const r=c.rates||{};
  const shares=[];
  const add=(empId,role,p,ruleId)=>{p=num(p);shares.push({empId,role,pct:p,amount:revenue>0?Math.round(revenue*p/100):0,ruleId:ruleId||null})};
  if(c.teacherId) add(c.teacherId,'teacher',r.teacher);
  if(c.techId) add(c.techId,'tech',r.tech);
  if(c.soldBy && c.soldBy!=='self') add(c.soldBy,'sales',r.sales);
  (r.extras||[]).forEach(x=>{if(x&&x.empId) add(x.empId,'extra',x.pct,x.ruleId)});
  const sharesTotal=shares.reduce((s,x)=>s+x.amount,0);
  const rexp=c.retake&&c.retake.kind==='expense'?Math.round(num(c.retake.fee)):0;
  const expense=Math.round(num(c.expense))+rexp;
  const vanguard=revenue-sharesTotal-expense;
  const byEmp={};
  shares.forEach(s=>{byEmp[s.empId]=(byEmp[s.empId]||0)+s.amount});
  return {cost,pct,paid,fee,rexp,refund,revenue,shares,sharesTotal,expense,vanguard,byEmp};
}

/* Ставки, которые фиксируются в карточке клиента при сохранении */
function empRate(emp,city,role){
  if(!emp) return 0;
  if(role==='sales' && emp.noSales) return 0;
  const v=emp.rates&&emp.rates[city]&&emp.rates[city][role];
  if(v===undefined||v===null||v==='') return role==='sales'?10:0;
  return num(v);
}
function ruleNorm(r){return {role:r.role||'tech',cities:r.cities&&r.cities.length?r.cities:(r.city?[r.city]:[]),whoId:r.whoId||r.techId||''}}
function ruleExtras(rules,city,techId,teacherId){
  const out=[];
  (rules||[]).forEach(r=>{ if(!r||r.enabled===false||r.deleted)return;const n=ruleNorm(r);const who=n.role==='teacher'?teacherId:techId;
    if(n.cities.includes(city) && who && n.whoId===who)
    (r.targets||[]).forEach(t=>{ if(t.empId && num(t.pct)) out.push({empId:t.empId,pct:num(t.pct),ruleId:r.id}) }) });
  return out;
}

/* Периоды по 10 дней */
function periodKeyOf(d){
  if(!d||typeof d!=='string')return null;
  const p=d.slice(0,10).split('-').map(Number);
  if(!p[0]||!p[1]||!p[2])return null;
  return p[0]+'-'+pad(p[1])+'-'+(p[2]<=10?1:p[2]<=20?2:3);
}
function periodRange(key){
  const [y,m,p]=key.split('-').map(Number);
  const last=new Date(y,m,0).getDate();
  return {start:isoDate(y,m,p===1?1:p===2?11:21),end:isoDate(y,m,p===1?10:p===2?20:last)};
}
function nextPeriod(key){let [y,m,p]=key.split('-').map(Number);p++;if(p>3){p=1;m++;if(m>12){m=1;y++}}return y+'-'+pad(m)+'-'+p}
function prevPeriod(key){let [y,m,p]=key.split('-').map(Number);p--;if(p<1){p=3;m--;if(m<1){m=12;y--}}return y+'-'+pad(m)+'-'+p}
function periodLabel(key){const [y,m,p]=key.split('-').map(Number);const r=periodRange(key);return Number(r.start.slice(8))+'–'+Number(r.end.slice(8))+' '+MONTHS_GEN[m-1]+' '+y}
function accrualDate(c,mode){
  const fb=c.createdAt?String(c.createdAt).slice(0,10):null;
  return mode==='payment'?(c.payDate||c.examDate||fb):(c.examDate||c.payDate||fb);
}
/* Начисления: период → игрок → {total, byRole, clients} */
function buildLedger(clients,mode){
  const L={};
  clients.forEach(c=>{
    if(!c||c.deleted)return;
    const key=periodKeyOf(accrualDate(c,mode)); if(!key)return;
    const r=calcClient(c);
    r.shares.forEach(s=>{
      if(!s.empId||!s.amount)return;
      const P=L[key]||(L[key]={});
      const e=P[s.empId]||(P[s.empId]={total:0,byRole:{teacher:0,tech:0,sales:0,extra:0},clients:{}});
      e.total+=s.amount; e.byRole[s.role]=(e.byRole[s.role]||0)+s.amount;
      const cl=e.clients[c.id]||(e.clients[c.id]={name:c.name||'',amount:0});
      cl.amount+=s.amount;
    });
  });
  return L;
}
/* Корректировки относительно зафиксированного на закрытии периода */
function corrections(frozen,current){
  const out=[]; const f=(frozen&&frozen.clients)||{}; const c=(current&&current.clients)||{};
  new Set([...Object.keys(f),...Object.keys(c)]).forEach(id=>{
    const d=((c[id]&&c[id].amount)||0)-((f[id]&&f[id].amount)||0);
    if(d!==0) out.push({cid:id,name:(c[id]&&c[id].name)||(f[id]&&f[id].name)||'Клиент',diff:d,removed:!c[id]});
  });
  return out;
}
</script>

<script>
let SB=null;
/* ===== Подключение к Supabase (вставьте свои значения) ===== */

function loginToEmail(l){l=String(l||'').trim().toLowerCase();if(!l)return '';if(l.includes('@'))return l;const d=l.replace(/[^\d]/g,'');return (d.length>=6?d:l.replace(/[^a-z0-9._-]/g,''))+'@'+LOGIN_DOMAIN}
function emailToLogin(e){e=String(e||'');return e.endsWith('@'+LOGIN_DOMAIN)?e.slice(0,-(LOGIN_DOMAIN.length+1)):e}

/* Хранилище документов поверх таблицы docs (тот же интерфейс, что был у CRM) */
function makeStore(sb){
  const cache=new Map();const subs=new Set();let ready=false;
  const parentOf=p=>p.split('/').slice(0,-1).join('/');
  const snap=(path)=>{const d=cache.get(path);return {id:path.split('/').pop(),exists:!!d,data:()=>d?JSON.parse(JSON.stringify(d)):undefined,metadata:{fromCache:!ready,hasPendingWrites:false}}};
  const notify=()=>subs.forEach(f=>{try{f()}catch(e){console.error(e)}});
  const err=(e)=>{const m=(e&&e.message)||'';const code=/row-level|permission|JWT|auth/i.test(m)?'invalid_argument':/quota|limit/i.test(m)?'quota_exceeded':'unavailable';return {code,message:m}};
  async function loadAll(){
    let from=0;const size=1000;const rows=[];
    while(true){const {data,error}=await sb.from('docs').select('path,data').range(from,from+size-1);if(error)throw err(error);rows.push(...data);if(data.length<size)break;from+=size}
    cache.clear();rows.forEach(r=>cache.set(r.path,r.data));ready=true;notify();
  }
  function startRealtime(){
    sb.channel('docs-all').on('postgres_changes',{event:'*',schema:'public',table:'docs'},p=>{
      if(p.eventType==='DELETE'){const path=(p.old&&p.old.path);if(path)cache.delete(path)}
      else if(p.new&&p.new.path)cache.set(p.new.path,p.new.data);
      notify();
    }).subscribe();
    setInterval(()=>{if(document.visibilityState==='visible')loadAll().catch(()=>{})},60000);
  }
  function deepMerge(a,b){const o={...(a||{})};Object.entries(b).forEach(([k,v])=>{o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&o[k]&&typeof o[k]==='object'&&!Array.isArray(o[k]))?deepMerge(o[k],v):v});return o}
  async function put(path,data){
    const prev=cache.get(path);cache.set(path,data);notify();
    const {error}=await sb.from('docs').upsert({path,col:parentOf(path),data});
    if(error){if(prev===undefined)cache.delete(path);else cache.set(path,prev);notify();throw err(error)}
  }
  function docRef(path){return {id:path.split('/').pop(),path,
    get:async()=>snap(path),
    set:async d=>put(path,JSON.parse(JSON.stringify(d))),
    update:async d=>{if(!cache.has(path))throw {code:'invalid_argument',message:'no doc'};return put(path,deepMerge(cache.get(path),JSON.parse(JSON.stringify(d))))},
    delete:async()=>{const prev=cache.get(path);cache.delete(path);notify();const {error}=await sb.from('docs').delete().eq('path',path);if(error){cache.set(path,prev);notify();throw err(error)}},
    onSnapshot:(next)=>{const f=()=>{if(ready)next(snap(path))};subs.add(f);setTimeout(f);return()=>subs.delete(f)},
    collection:sub=>colRef(path+'/'+sub)}}
  function colRef(path){return {path,
    doc:id=>docRef(path+'/'+(id||(Date.now().toString(36)+Math.random().toString(36).slice(2,10)))),
    onSnapshot:(next)=>{const f=()=>{if(!ready)return;const docs=[...cache.keys()].filter(k=>parentOf(k)===path).map(snap);next({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false}})};subs.add(f);setTimeout(f);return()=>subs.delete(f)}}}
  return {db:{doc:docRef,collection:colRef},loadAll,startRealtime};
}

<script>
/* ===== Интерфейс ===== */
const BASE='vg/main';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
function esc(s){return String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
function money(n){return Math.round(n||0).toLocaleString('ru-RU').replace(/[\s ]/g,' ')+' ₸'}
function nfmt(n){return Math.round(n||0).toLocaleString('ru-RU').replace(/[\s ]/g,' ')}

const queues={};
function q(path,fn){const p=(queues[path]||Promise.resolve()).then(fn);queues[path]=p.catch(()=>{});return p.catch(e=>{writeErr(e);throw e})}
function writeErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'){S.canWrite=false;toast('Нет прав на изменение данных. Попросите тренера дать доступ «Участник» или выше.');render()}
  else if(code==='quota_exceeded')toast('База заполнена: '+(e.message||'лимит'));
  else if(code==='resource_exhausted')toast('Слишком много действий подряд, подождите пару секунд');
  else toast('Не удалось сохранить, попробуйте ещё раз');
}
function setDoc(path,data){return q(path,()=>S.db.doc(path).set(data))}
function updDoc(path,data){return q(path,()=>S.db.doc(path).update(data))}

/* ---------- toasts, modals ---------- */
function toast(msg,undo){
  const el=document.createElement('div');el.className='toast';
  el.innerHTML='<span></span>'+(undo?'<button>Отменить</button>':'');
  el.firstChild.textContent=msg;
  $('#toasts').appendChild(el);
  let done=false;const kill=()=>{if(!done){done=true;el.remove()}};
  if(undo)el.querySelector('button').onclick=()=>{kill();undo()};
  setTimeout(kill,undo?7000:4000);
}
let modalStack=[];
function openModal(html,{cls='',onClose}={}){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML='<div class="modal '+cls+'">'+html+'</div>';
  ov.addEventListener('mousedown',e=>{if(e.target===ov)closeModal()});
  $('#modals').appendChild(ov);modalStack.push({ov,onClose});
  document.body.style.overflow='hidden';
  return ov.firstChild;
}
function closeModal(){
  const m=modalStack.pop();if(!m)return;
  m.ov.remove();if(m.onClose)m.onClose();
  if(!modalStack.length)document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalStack.length)closeModal()});
function ask(title,text,okText='Удалить',danger=true){
  return new Promise(res=>{
    const m=openModal(`<div class="mh"><h2>${esc(title)}</h2></div><div class="mb"><p style="margin:0">${text}</p></div>
    <div class="mf"><button class="btn ${danger?'pri':'pri'}" data-ok style="${danger?'background:var(--danger);color:#fff':''}">${esc(okText)}</button><button class="btn" data-no>Отмена</button></div>`,{cls:'narrow',onClose:()=>res(false)});
    m.querySelector('[data-ok]').onclick=()=>{const s=modalStack[modalStack.length-1];s.onClose=null;closeModal();res(true)};
    m.querySelector('[data-no]').onclick=()=>closeModal();
  });
}

  return `<div class="kpi ${o.hero?'hero':''}"><div class="kh">${ic?`<svg class="i" viewBox="0 0 24 24">${KIC[ic]||IC[ic]||''}</svg>`:''}<span>${label}</span></div><div class="kv"><div class="v">${value}</div>${d}</div>${o.sub?`<div class="tiny muted" style="margin-top:2px">${o.sub}</div>`:''}</div>`}
function pctDelta(cur,prev){if(!prev)return cur?null:0;return Math.round((cur-prev)/Math.abs(prev)*100)}

/* ===== ДОСКА ===== */
function clientMatches(c,city){
  const f=S.f;
  if(city!=='all'&&c.city!==city)return false;
  if(!f.arch&&c.archived)return false;
  if(f.arch&&!c.archived)return false;
  if(f.q){const s=(c.name+' '+(c.comment||'')+' '+empName(c.teacherId)+' '+empName(c.techId)).toLowerCase();if(!s.includes(f.q.toLowerCase()))return false}
  if(f.exam&&c.exam!==f.exam)return false;
  if(f.status&&c.status!==f.status)return false;
  if(f.emp){const ids=[c.teacherId,c.techId,c.soldBy,...((c.rates&&c.rates.extras)||[]).map(x=>x.empId)];if(!ids.includes(f.emp))return false}
  const d=accrualDate(c,cfg().accrual)||'';
  if(f.from&&d<f.from)return false;
  if(f.to&&d>f.to)return false;
  return true;
}

function slotOwner(s){return s&&s.clientId&&S.clients[s.clientId]&&!S.clients[s.clientId].deleted?s.clientId:''}

function sessLive(x){if(!(x&&!x.deleted&&x.type==='session'&&x.clientId&&S.clients[x.clientId]&&!S.clients[x.clientId].deleted))return false;
  if(x.bookKind==='offer'){const c=S.clients[x.clientId];return !!x.expiresAt&&x.expiresAt>nowIso()&&statusById(c.status).id==='offered'}return true}
function holdLabel(iso){if(!iso)return '';const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes())+(isoOf(d)===today()?' сегодня':isoOf(d)===addDays(today(),1)?' завтра':' '+dshow(isoOf(d)).slice(0,5))}

    (x.type==='session'&&sessLive(x)&&x.clientId!==excl)||(x.type==='slot'&&slotOwner(x)&&slotOwner(x)!==excl)||(x.type!=='slot'&&x.type!=='session')))
    .map(x=>[toMin(x.start),toMin(x.start)+num(x.dur||60)]);
}

function freeAt(pid,city,date,a,b,excl){
  return windowsOf(pid,city,date).some(w=>toMin(w.start)<=a&&toMin(w.start)+num(w.dur)>=b)&&!busyOf(pid,date,excl).some(([x,y])=>x<b&&y>a);

function pairOptions(city,excl,from,to){
  const L=cfg().sessionMin;const td=today();const nm=new Date().getHours()*60+new Date().getMinutes();
  const techs=liveEmps().filter(e=>e.active!==false&&hasRole(e,city,'tech'));
  const teachers=liveEmps().filter(e=>e.active!==false&&hasRole(e,city,'teacher'));
  const out=[];const seen=new Set();
  liveSched().filter(w=>w.type==='slot'&&w.date>=from&&w.date<=to&&!slotOwner(w)&&techs.some(t=>t.id===w.playerId)).forEach(w=>{
    const ws=toMin(w.start),we=ws+num(w.dur);
    for(let t=ws;t+L<=we;t+=60){
      if(w.date===td&&t<=nm)continue;
      if(!freeAt(w.playerId,city,w.date,t,t+L,excl))continue;
      teachers.forEach(tc=>{if(tc.id===w.playerId||!freeAt(tc.id,city,w.date,t,t+L,excl))return;
        const k=w.date+'|'+t+'|'+w.playerId+'|'+tc.id;if(seen.has(k))return;seen.add(k);

async function syncSession(oldId,sess,cid,kind){
  const old=oldId&&S.sched[oldId]&&!S.sched[oldId].deleted?S.sched[oldId]:null;
  if(old&&sess&&sameOpt(old,sess))return oldId;
  if(old)await updDoc(BASE+'/schedule/'+oldId,{deleted:true});
  if(!sess)return '';
  const nid=newId('schedule');const c=S.clients[cid]||F||{};
  await setDoc(BASE+'/schedule/'+nid,{type:'session',date:sess.date,start:sess.start,dur:num(sess.dur)||cfg().sessionMin,city:sess.city||c.city||'',techId:sess.techId,teacherId:sess.teacherId,clientId:cid,bookKind:kind,deleted:false,createdAt:nowIso(),createdBy:S.uid||''});
  return nid;
}

async function syncSlot(oldId,newId_,cid,kind){

  if(newId_&&S.sched[newId_])await updDoc(BASE+'/schedule/'+newId_,{clientId:cid,bookKind:kind});

function currentKey(){return periodKeyOf(today())}
function paymentsOf(key,empId){const p=S.payments[key];return (p&&p.byEmp&&p.byEmp[empId])||[]}
function paidSum(key,empId){return paymentsOf(key,empId).reduce((a,x)=>a+num(x.amount),0)}
/* Строка выплат по игроку за период */
function payRow(key,empId,L){
  const cur=(L[key]&&L[key][empId])||null;
  const fr=S.periods[key]&&S.periods[key].emps?S.periods[key].emps[empId]:null;
  const frozen=!!S.periods[key];
  const total=cur?cur.total:0;
  const base=frozen?(fr||{total:0,byRole:{teacher:0,tech:0,sales:0,extra:0},clients:{}}):(cur||{total:0,byRole:{teacher:0,tech:0,sales:0,extra:0},clients:{}});
  const corr=frozen?corrections(fr,cur):[];
  const paid=paidSum(key,empId);
  return {empId,total,base,corr,corrSum:corr.reduce((a,x)=>a+x.diff,0),paid,due:total-paid,frozen,cur};
}
function allPeriodKeys(){
  const L=ledger();const keys=new Set([...Object.keys(L),...Object.keys(S.payments),currentKey()]);
  Object.keys(S.periods).forEach(k=>keys.add(k));
  let min=[...keys].sort()[0]||currentKey();const out=[];let k=min;let guard=0;
  const sortKey=x=>{const [y,m,p]=x.split('-').map(Number);return y*100+m*10+p};
  const maxK=[...keys].sort((a,b)=>sortKey(b)-sortKey(a))[0];
  while(guard++<400){out.push(k);if(k===maxK)break;k=nextPeriod(k)}
  return out.reverse();
}

/* Фиксация закрытых периодов (снимок начислений на момент закрытия) */
let freezing=false;const frozenTried=new Set();
async function maybeFreeze(){
  if(freezing||!isOwner()||!S.canWrite)return;
  if(!(S.fresh.clients&&S.fresh.periods&&S.fresh.config&&S.fresh.emps))return;
  const L=ledger();const keys=Object.keys(L);if(!keys.length)return;
  const cur=currentKey();let k=keys.sort((a,b)=>periodRange(a).start.localeCompare(periodRange(b).start))[0];
  const todo=[];let guard=0;
  while(periodRange(k).end<today()&&guard++<120){if(!S.periods[k]&&!frozenTried.has(k))todo.push(k);k=nextPeriod(k)}
  if(!todo.length)return;freezing=true;
  for(const key of todo.slice(-36)){frozenTried.add(key);
    try{await setDoc(BASE+'/periods/'+key,{frozenAt:nowIso(),emps:L[key]||{}})}catch(e){break}}
  freezing=false;
}

function shortPeriod(k){const [y,m,p]=k.split('-').map(Number);const r=periodRange(k);return Number(r.start.slice(8))+'–'+Number(r.end.slice(8))+'.'+pad(m)}

function anRange(){
  const a=S.an;
  if(a.mode==='decade'){const k=a.period||currentKey();return periodRange(k)}
  if(a.mode==='custom'){return {start:a.from||'2000-01-01',end:a.to||'2999-12-31'}}
  const ym=a.month||today().slice(0,7);const [y,m]=ym.split('-').map(Number);return {start:ym+'-01',end:isoDate(y,m,new Date(y,m,0).getDate())};
}
function stats(city,rng){
  const mode=cfg().accrual;
  const cl=liveClients().filter(c=>(city==='all'||c.city===city)).filter(c=>{const d=accrualDate(c,mode);return d&&d>=rng.start&&d<=rng.end});
  const s={clients:cl.length,cost:0,paid:0,refund:0,revenue:0,payroll:0,cexp:0,vanguard:0,gexp:0,byExam:{},byStatus:{},byEmp:{}};
  cl.forEach(c=>{const r=calcClient(c);s.cost+=r.cost;s.paid+=r.paid;s.refund+=r.refund;s.revenue+=r.revenue;s.payroll+=r.sharesTotal;s.cexp+=r.expense;s.vanguard+=r.vanguard;
    const ex=c.exam==='Другое'?'Другое':c.exam;s.byExam[ex]=(s.byExam[ex]||0)+1;s.byStatus[statusById(c.status).id]=(s.byStatus[statusById(c.status).id]||0)+1;
    Object.entries(r.byEmp).forEach(([id,v])=>s.byEmp[id]=(s.byEmp[id]||0)+v)});
  Object.values(S.expenses).filter(x=>!x.deleted&&x.date>=rng.start&&x.date<=rng.end&&(city==='all'||x.city===city)).forEach(x=>s.gexp+=num(x.amount));
  s.net=s.vanguard-s.gexp;
  let ex=0,rf=0;cl.forEach(c=>{const o=closedOutcome(c);if(o==='good')ex++;else if(o==='bad')rf++});s.success=ex+rf?Math.round(ex/(ex+rf)*100):null;
  s.good=ex;s.badN=rf;
  s.bad=cl.filter(c=>closedOutcome(c)==='bad');
  s.reasons={internet:0,late:0,none:0};s.full=0;s.partial=0;s.fullSum=0;s.partialSum=0;s.badByEmp={};s.badByCity={};
  s.bad.forEach(c=>{const cl_=c.closed||{};const rs=cl_.reasons||[];if(!rs.length)s.reasons.none++;rs.forEach(r=>s.reasons[r]=(s.reasons[r]||0)+1);
    const amt=Math.round(num(c.refund));if(cl_.refundType==='full'||(!cl_.refundType&&c.status==='refund'&&amt>=calcClient({...c,refund:0}).paid)){s.full++;s.fullSum+=amt}else{s.partial++;s.partialSum+=amt}
    [c.teacherId,c.techId].filter(Boolean).forEach(id=>s.badByEmp[id]=(s.badByEmp[id]||0)+1);s.badByCity[c.city]=(s.badByCity[c.city]||0)+1});
  s.lostRevenue=s.fullSum+s.partialSum;
  return s;
}

  const m=openModal(`<div class="mh"><h2>${id?'Расход':'Новый расход'}</h2><button class="iconbtn" data-x>✕</button></div><div class="mb">
    <div class="grid2"><div class="field"><label class="lbl">Дата</label><input type="date" class="input" id="x-date" value="${esc(x.date)}"></div>
    <div class="field"><label class="lbl">Сумма, ₸</label><input class="input num" id="x-amount" inputmode="numeric" value="${x.amount===''?'':nfmt(x.amount)}" style="font-size:20px"></div></div>
    <div class="field"><label class="lbl">На что</label><input class="input" id="x-what" value="${esc(x.what)}" placeholder="Аренда, реклама…"></div>
    <div class="field"><label class="lbl">Город</label>${seg('xcity',[...CITIES,{id:'general',name:'Общий'}],x.city)}</div>
    <div class="field"><label class="lbl">Кто заплатил</label><select class="select" id="x-payerId"><option value="">— другое —</option>${liveEmps().map(e=>`<option value="${e.id}" ${x.payerId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <input class="input" id="x-payer" style="margin-top:8px" placeholder="Или впишите вручную" value="${esc(x.payer||'')}"></div>
  </div><div class="mf"><button class="btn pri big" data-save ${S.canWrite?'':'disabled'}>Сохранить</button><button class="btn" data-x>Отмена</button><div class="grow"></div>${id?'<button class="btn danger" data-del>Удалить</button>':''}</div>`);
  $$('[data-x]',m).forEach(b=>b.onclick=()=>closeModal());
  $('[data-seg="xcity"]',m).onclick=e=>{const b=e.target.closest('button');if(!b)return;x.city=b.dataset.v;$$('[data-seg="xcity"] button',m).forEach(z=>z.classList.toggle('on',z===b))};
  $('#x-amount',m).onblur=e=>{e.target.value=nfmt(num(e.target.value.replace(/\D/g,'')))};
  $('[data-save]',m).onclick=async()=>{
    const amount=num($('#x-amount').value.replace(/\D/g,''));const what=$('#x-what').value.trim();
    if(!amount){toast('Введите сумму');return}if(!what){toast('Напишите, на что расход');return}
    const data={date:$('#x-date').value||today(),what,amount,city:x.city,payerId:$('#x-payerId').value,payer:$('#x-payer').value.trim(),deleted:false,updatedAt:nowIso(),by:S.uid||''};
    const eid=id||newId('expenses');closeModal();
    try{await setDoc(BASE+'/expenses/'+eid,data);toast('Расход сохранён')}catch(e){}
  };
  if(id)$('[data-del]',m).onclick=async()=>{if(await ask('Удалить расход?',esc(x.what)+' — '+money(x.amount))){closeModal();try{await updDoc(BASE+'/expenses/'+id,{deleted:true});toast('Расход удалён',()=>updDoc(BASE+'/expenses/'+id,{deleted:false}))}catch(e){}}};
}

/* ===== НАСТРОЙКИ ===== */
function saveConfig(patch){const c={...cfg(),...patch};return setDoc(BASE+'/config/app',{statuses:c.statuses,statusesV:4,accrual:c.accrual,rules:c.rules,sessionMin:c.sessionMin,updatedAt:nowIso()})}
function viewSettings(){
  const c=cfg();
  const viewers=Object.keys(S.viewers);resolveNames(viewers);
  const log=[];liveClients().concat(Object.values(S.clients).filter(x=>x.deleted)).forEach(cl=>(cl.history||[]).forEach(h=>log.push({...h,name:cl.name})));
  log.sort((a,b)=>String(b.at).localeCompare(a.at));resolveNames([...new Set(log.slice(0,100).map(h=>h.by))]);
  const used=id=>Object.values(S.clients).some(x=>!x.deleted&&x.status===id);
  return `
  <div class="card"><div class="sectiontitle" style="margin-top:0">Начисление денег игрокам</div>
    ${seg('accrual',[{id:'exam',name:'По дате экзамена'},{id:'payment',name:'По дате брони'}],c.accrual)}
    <p class="small muted">Определяет, в какой 10-дневный период и месяц попадает клиент — в выплатах и в аналитике.</p></div>

  <div class="card" style="margin-top:16px"><div class="row"><div class="sectiontitle grow" style="margin:0">Правила-доплаты</div><button class="btn pri" data-act="newRule">+ Правило</button></div>
    <p class="small muted">«Если учитель (или тех специалист) = X в выбранных городах, то дополнительно Y получает N% от выручки клиента». Подставляется в анкету при выборе игрока и фиксируется при сохранении.</p>
    <div class="list">${c.rules.filter(r=>!r.deleted).map(r=>`<div class="item"><span class="grow">${ruleText(r)}</span>
      <label class="check small"><input type="checkbox" data-rule-on="${r.id}" ${r.enabled!==false?'checked':''}> вкл</label><button class="btn sm" data-rule-edit="${r.id}">Изменить</button><button class="btn sm danger" data-rule-del="${r.id}">Удалить</button></div>`).join('')||'<div class="muted small">Правил пока нет</div>'}</div></div>

  <div class="card" style="margin-top:16px"><div class="row"><div class="sectiontitle grow" style="margin:0">Статусы</div><button class="btn" data-act="addStatus">+ Статус</button></div>
    <p class="small muted">Цвет карточки = колонка доски. Процесс: Бронь → Дата выбрана → Пересдача → Закрытая сделка.</p>
    <div class="list">${c.statuses.map((s,i)=>`<div class="item"><input type="color" value="${s.color}" data-st-color="${i}" style="width:42px;height:42px;border:0;background:none;padding:0">
      <input class="input" data-st-name="${i}" value="${esc(s.name)}" style="max-width:320px">
      <div class="grow"></div><button class="btn sm" data-st-up="${i}" ${i?'':'disabled'}>↑</button>
      ${DEFAULT_STATUSES.some(d=>d.id===s.id)||used(s.id)?'':`<button class="btn sm danger" data-st-del="${i}">Удалить</button>`}</div>`).join('')}</div></div>

  <div class="card" style="margin-top:16px"><div class="sectiontitle" style="margin-top:0">Доступ</div>
    <p class="small" style="margin-top:0">Вход — по логину и паролю. Как добавить игрока:</p>
    <ol class="small" style="margin:0 0 12px;padding-left:20px;line-height:1.8">
      <li>В разделе «Игроки» впишите игроку логин — например номер телефона <b>77011234567</b>.</li>
      <li>В Supabase откройте <b>Authentication → Users → Add user → Create new user</b>: email — тот, что подскажет карточка игрока (например <b>77011234567@${LOGIN_DOMAIN}</b>), пароль — любой, галочку «Auto Confirm User» оставьте включённой.</li>
      <li>Передайте игроку адрес сайта, логин и пароль. При первом входе он сразу попадает в свой кабинет.</li></ol>
    <p class="tiny muted">Сменить пароль или отключить доступ — там же, в Supabase → Authentication → Users. Кто вошёл, но не указан среди игроков, увидит экран «Доступ ещё не настроен».</p>
    <div class="list">${viewers.map(u=>{const e=liveEmps().find(x=>x.userId===u);return `<div class="item"><span class="grow">${esc(accName(u))}${u===S.uid?' (вы)':''}</span>${e?`<span class="chip acc">${esc(e.name)}${(e.roles||[]).includes('owner')?' · тренер':''}</span>`:'<span class="chip">не привязан</span>'}</div>`}).join('')||'<div class="muted small">Пока никто не заходил</div>'}</div></div>

  <div class="card" style="margin-top:16px"><div class="sectiontitle" style="margin-top:0">Журнал изменений клиентов</div>
    <div class="small">${log.slice(0,100).map(h=>`<div style="padding:6px 0;border-top:1px solid var(--line)">${dshow(h.at)} ${String(h.at).slice(11,16)} · <b>${esc(accName(h.by))}</b> · ${esc(h.name)} — ${esc(h.action)}</div>`).join('')||'<div class="muted">Пока пусто</div>'}</div>
    <p class="tiny muted">Время — UTC. Показаны последние 100 записей.</p></div>`;
}
function ruleText(r){const n=ruleNorm(r);return `${esc(n.cities.map(c=>CITY_NAME[c]).join(', '))}: если ${n.role==='teacher'?'учитель':'тех специалист'} = <b>${esc(empName(n.whoId))}</b>, то ${(r.targets||[]).map(t=>'<b>'+esc(empName(t.empId))+'</b> +'+t.pct+'%').join(' и ')}`}
function openRule(id){
  const c=cfg();const src=id?c.rules.find(r=>r.id===id):null;
  const n=src?ruleNorm(src):{role:'teacher',cities:[],whoId:''};
  const R={id:src?src.id:'r'+Date.now().toString(36),role:n.role,cities:n.cities.slice(),whoId:n.whoId,targets:src?JSON.parse(JSON.stringify(src.targets||[])):[{empId:'',pct:''}],enabled:src?src.enabled!==false:true};
  if(!R.targets.length)R.targets.push({empId:'',pct:''});
  openModal('<div id="rf"></div>',{});
  const draw=()=>{const box=$('#rf');
    const cand=liveEmps().filter(e=>(e.active!==false||e.id===R.whoId)&&(R.cities.length?R.cities.some(ct=>hasRole(e,ct,R.role)):CITIES.some(ct=>hasRole(e,ct.id,R.role))));
    const all=liveEmps().filter(e=>e.active!==false||R.targets.some(t=>t.empId===e.id));
    const who=emp(R.whoId);
    const base=who&&R.cities.length?R.cities.map(ct=>CITY_NAME[ct]+': '+(R.role==='teacher'?'учитель':'тех')+' '+empRate(who,ct,R.role)+'%').join(', '):'';
    box.innerHTML=`<div class="mh"><h2>Правило-доплата</h2><button class="iconbtn" data-x>✕</button></div><div class="mb">
      <div class="field"><label class="lbl">Условие</label>${seg('rrole',[{id:'teacher',name:'Если учитель ='},{id:'tech',name:'Если тех специалист ='}],R.role)}</div>
      <div class="field"><select class="select" id="r-who"><option value="">— выберите игрока —</option>${cand.map(e=>`<option value="${e.id}" ${R.whoId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select></div>
      <div class="field"><label class="lbl">В городах</label><div class="seg" data-rcities>${CITIES.map(ct=>`<button type="button" data-v="${ct.id}" class="${R.cities.includes(ct.id)?'on':''}">${ct.name}</button>`).join('')}</div></div>
      ${R.targets.map((t,i)=>`<div class="field"><label class="lbl">то дополнительно получает${R.targets.length>1?' ('+(i+1)+')':''}</label><div class="row"><select class="select" data-t-emp="${i}" style="flex:1"><option value="">—</option>${all.map(e=>`<option value="${e.id}" ${t.empId===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select><div class="pct"><input class="input" data-t-pct="${i}" inputmode="decimal" value="${esc(t.pct)}">%</div>${R.targets.length>1?`<button type="button" class="btn sm ghost" data-t-del="${i}">✕</button>`:''}</div></div>`).join('')}
      <button class="btn sm" data-add>+ ещё игрок</button>
      ${base?`<div class="info">Сам ${esc(who.name)} получает по своей ставке: ${esc(base)}. Доплата идёт дополнительно от выручки клиента, получатель может быть в любой роли или без роли.</div>`:''}
      <div class="note">Пример: «Алматы, Шымкент: если учитель = Перизат, то Нурбек +15%». У Перизат в карточке в этих городах стоит 10%. Правило применяется к новым анкетам и к тем, где учитель или тех специалист выбран заново. Сохранённые клиенты не пересчитываются.</div>
    </div><div class="mf"><button class="btn pri big" data-save>Сохранить</button><button class="btn" data-x>Отмена</button></div>`;
    $$('[data-x]',box).forEach(b=>b.onclick=()=>closeModal());
    $('[data-seg="rrole"]',box).onclick=e=>{const b=e.target.closest('button');if(!b)return;R.role=b.dataset.v;R.whoId='';draw()};
    $('#r-who',box).onchange=e=>{R.whoId=e.target.value;draw()};
    $('[data-rcities]',box).onclick=e=>{const b=e.target.closest('button');if(!b)return;const v=b.dataset.v;R.cities=R.cities.includes(v)?R.cities.filter(x=>x!==v):[...R.cities,v];draw()};
    $$('[data-t-emp]',box).forEach(x=>x.onchange=()=>R.targets[x.dataset.tEmp].empId=x.value);
    $$('[data-t-pct]',box).forEach(x=>x.oninput=()=>R.targets[x.dataset.tPct].pct=x.value);
    $$('[data-t-del]',box).forEach(x=>x.onclick=()=>{R.targets.splice(Number(x.dataset.tDel),1);draw()});
    $('[data-add]',box).onclick=()=>{R.targets.push({empId:'',pct:''});draw()};
    $('[data-save]',box).onclick=async()=>{
      const targets=R.targets.filter(t=>t.empId&&num(t.pct)).map(t=>({empId:t.empId,pct:num(t.pct)}));
      if(!R.whoId){toast('Выберите игрока в условии');return}if(!R.cities.length){toast('Выберите хотя бы один город');return}
      if(!targets.length){toast('Добавьте получателя доплаты с процентом');return}
      const rule={id:R.id,role:R.role,whoId:R.whoId,cities:R.cities,city:R.cities[0],techId:R.role==='tech'?R.whoId:'',targets,enabled:R.enabled};
      const rules=cfg().rules.filter(r=>r.id!==R.id).concat(rule);closeModal();
      try{await saveConfig({rules});toast('Правило сохранено')}catch(e){}
    };};
  draw();
}

/* ===== МОЙ КАБИНЕТ ===== */
function viewMe(){
  const me=myEmp();if(!me)return '<div class="card empty"><b>Кабинет недоступен</b>Ваш аккаунт не привязан к игроку.</div>';
  const L=ledger();const keys=allPeriodKeys();const cur=currentKey();const ym=today().slice(0,7);
  const hist=keys.map(k=>({k,...payRow(k,me.id,L)})).filter(r=>r.total||r.paid);
  const due=hist.reduce((a,r)=>a+r.due,0),paidAll=hist.reduce((a,r)=>a+r.paid,0),earnedAll=hist.reduce((a,r)=>a+r.total,0);
  const month=hist.filter(r=>r.k.startsWith(ym)).reduce((a,r)=>a+r.total,0);
  const period=(hist.find(r=>r.k===cur)||{total:0}).total;
  const mine=c=>c.teacherId===me.id||c.techId===me.id||c.soldBy===me.id||((c.rates&&c.rates.extras)||[]).some(x=>x.empId===me.id);
  const allMine=liveClients().filter(mine);
  const myClients=allMine.filter(c=>!c.archived).sort((a,b)=>(a.examDate||'9').localeCompare(b.examDate||'9'));
  const sid=c=>statusById(c.status).id;
  const inWork=allMine.filter(c=>sid(c)!=='closed').length,closed=allMine.filter(c=>sid(c)==='closed');
  const good=closed.filter(c=>closedOutcome(c)==='good').length,bad=closed.filter(c=>closedOutcome(c)==='bad').length;
  const sat=good+bad?Math.round(good/(good+bad)*100):null;
  const upcoming=schItemsFor(me.id,today(),addDays(today(),13));
  const freeW=liveSched().filter(w=>w.type==='slot'&&w.playerId===me.id&&!slotOwner(w)&&w.date>=today()&&w.date<=addDays(today(),20)).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
  const freeH=Math.round(freeW.filter(w=>w.date<=addDays(today(),6)).reduce((a,w)=>a+num(w.dur),0)/60);
  const byDay={};freeW.forEach(w=>(byDay[w.date]=byDay[w.date]||[]).push(w));
  const roleOf=c=>[c.teacherId===me.id?'учитель':'',c.techId===me.id?'тех':'',c.soldBy===me.id?'продажа':'',((c.rates&&c.rates.extras)||[]).some(x=>x.empId===me.id)?'доплата':''].filter(Boolean).join(', ');
  const KI={'К выплате сейчас':'wallet','Текущий период':'clock','За этот месяц':'cal','Заработано за всё время':'coins','Мои клиенты':'users','Довольные клиенты':'smile','Записей на 2 недели':'cal','Свободно на неделе':'clock'};
  const k=(l,v,sub,h)=>kpi(KI[l],l,v,{sub,hero:h});
  const hr=new Date().getHours();const hi=hr<12?'Доброе утро':hr<18?'Добрый день':'Добрый вечер';
  return `<div class="card" style="margin-bottom:16px;padding:22px 24px"><div class="row" style="align-items:flex-start">
      <div style="width:56px;height:56px;border-radius:14px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-size:24px;font-weight:800;flex:none">${esc((me.name||'?').slice(0,1).toUpperCase())}</div>
      <div class="grow"><div class="small muted">${hi},</div><div style="font-size:24px;font-weight:750;letter-spacing:-.01em">${esc(me.name)}</div>
        <div class="row" style="gap:6px;margin-top:8px">${(me.roles||[]).filter(r=>r!=='owner').map(r=>`<span class="chip acc">${(ROLES.find(x=>x.id===r)||{}).name}</span>`).join('')}${(me.roles||[]).includes('owner')?'<span class="chip acc">Тренер</span>':''}</div></div>
      <div class="small muted" style="text-align:right;line-height:1.7">${me.email?'Логин: <b style="color:var(--text)">'+esc(emailToLogin(me.email))+'</b><br>':''}${rolesSummary(me)}</div></div></div>
    <div class="kpis">${k('К выплате сейчас',money(due),'',true)}${k('Текущий период',money(period),periodLabel(cur))}${k('За этот месяц',money(month),MONTHS[Number(ym.slice(5))-1])}${k('Заработано за всё время',money(earnedAll),'выплачено '+money(paidAll))}</div>
    <div class="kpis">${k('Мои клиенты',nfmt(allMine.length),'в работе '+inWork+' · закрыто '+closed.length)}${k('Довольные клиенты',sat===null?'—':sat+'%',good+bad?good+' из '+(good+bad)+' закрытых':'пока нет закрытых')}${k('Записей на 2 недели',nfmt(upcoming.length),'экзамены и пересдачи')}${k('Свободно на неделе',freeH+' ч',freeH?'':'добавьте слоты')}</div>
    <div class="charts" style="grid-template-columns:repeat(auto-fit,minmax(380px,1fr))">
      <div class="chartbox"><div class="row"><h3 class="grow">Моё свободное время</h3><button class="btn sm pri" data-act="myFree">+ Добавить слот</button></div>
        ${freeW.length?`<div style="margin-top:12px;display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto">${Object.entries(byDay).map(([d,ws])=>`<div class="row" style="gap:12px;flex-wrap:nowrap;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;${d===today()?'background:var(--accent-soft)':''}">
            <div style="width:62px;flex:none;text-align:center"><div class="tiny muted" style="text-transform:uppercase;font-weight:600">${WD[(new Date(d+'T00:00:00').getDay()+6)%7]}</div><div style="font-size:20px;font-weight:750;line-height:1.1">${Number(d.slice(8))}</div><div class="tiny muted">${MONTHS_GEN[Number(d.slice(5,7))-1].slice(0,3)}</div></div>
            <div class="row" style="gap:6px">${ws.map(w=>`<button type="button" class="btn sm" style="border-color:${SLOT_FREE};color:var(--ok);font-weight:650" data-slot="${w.id}" title="Нажмите, чтобы удалить">${w.start}–${fromMin(toMin(w.start)+num(w.dur))}</button>`).join('')}</div></div>`).join('')}</div>
          <div class="tiny muted" style="margin-top:8px">Показаны 3 недели вперёд. Нажмите на время, чтобы удалить слот.</div>`
          :'<div class="empty" style="padding:28px 10px"><b>Слотов пока нет</b>Без свободного времени вас не предложат в связку. Нажмите «+ Добавить слот».</div>'}</div>
      <div class="chartbox"><h3>Мои записи на 2 недели</h3>
        ${upcoming.length?`<div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">${upcoming.map(it=>`<div class="row" style="gap:10px;flex-wrap:nowrap"><div class="small num" style="width:80px;flex:none">${WD[(new Date(it.date+'T00:00:00').getDay()+6)%7]}, ${dshow(it.date).slice(0,5)}</div><div class="grow">${evHtml(it,true)}</div></div>`).join('')}</div>`:'<div class="muted small" style="margin-top:10px">Записей пока нет</div>'}
        <div style="margin-top:12px"><a href="#schedule">Открыть расписание →</a></div></div>
      <div class="chartbox" style="grid-column:1/-1"><h3>Заработок по периодам</h3><div class="small muted">Последние 9 периодов по 10 дней</div><div class="cv" style="height:220px"><canvas id="ch-me"></canvas></div></div>
    </div>
    <div class="sectiontitle">Мои клиенты (${myClients.length})</div>

const EXAM_COLOR='#e34948';
const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
function isoOf(dt){return isoDate(dt.getFullYear(),dt.getMonth()+1,dt.getDate())}
function addDays(d,n){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()+n);return isoOf(dt)}
function mondayOf(d){const dt=new Date(d+'T00:00:00');dt.setDate(dt.getDate()-((dt.getDay()+6)%7));return isoOf(dt)}
function toMin(t){const p=String(t||'0:0').split(':').map(Number);return (p[0]||0)*60+(p[1]||0)}
function fromMin(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function evType(id){return EV_TYPES.find(x=>x.id===id)||EV_TYPES[1]}
function liveSched(){return Object.values(S.sched||{}).filter(x=>!x.deleted)}
if(!S.sch)S.sch={week:mondayOf(today()),city:'',player:'',mine:null,mode:'week'};

function conflictsOf(ev,list){
  const who=partIds(ev).filter(Boolean);if(!who.length||!ev.date)return [];
  const a=toMin(ev.start),b=a+num(ev.dur||60);
  return list.filter(x=>x.id!==ev.id&&x.type!=='slot'&&(x.type!=='session'||sessLive(x))&&x.date===ev.date&&partIds(x).some(p=>who.includes(p))&&toMin(x.start)<b&&toMin(x.start)+num(x.dur||60)>a);
}

const SLOT_FREE='#16a34a',RETAKE_COLOR='#A08CD8';
function buildItems(from,to,pf){
  const all=liveSched();const items=[];
  all.filter(x=>x.date>=from&&x.date<=to&&pf.ev(x)).forEach(x=>{
    const end=fromMin(toMin(x.start)+num(x.dur||60));
    if(x.type==='session'&&x.bookKind==='offer'){if(!sessLive(x))return;const c=S.clients[x.clientId];
      items.push({kind:'session',id:x.id,date:x.date,start:x.start,end,free:true,color:OFFER_COLOR,type:'Предложено · держится до '+holdLabel(x.expiresAt),title:c.name,who:pairName(x),city:x.city,conf:false});return}
    if(x.type==='session'){if(!sessLive(x))return;const c=S.clients[x.clientId];
      items.push({kind:'session',id:x.id,date:x.date,start:x.start,end,color:x.bookKind==='retake'?RETAKE_COLOR:EXAM_COLOR,
        type:x.bookKind==='retake'?'Пересдача':'Экзамен '+(c.exam==='Другое'&&c.examOther?c.examOther:c.exam||''),title:c.name,who:pairName(x),city:x.city,conf:false,comment:c.address?'Адрес: '+c.address:''});return}
    if(x.type==='slot'){const cid=slotOwner(x);const c=cid?S.clients[cid]:null;
      if(!c&&pf.free===false)return;
      items.push({kind:'slot',id:x.id,date:x.date,start:x.start,end,free:!c,color:c?(x.bookKind==='retake'?RETAKE_COLOR:EXAM_COLOR):SLOT_FREE,
        type:c?(x.bookKind==='retake'?'Пересдача':'Экзамен '+(c.exam||'')):'Свободен · '+freeRoleLabel(x),title:c?c.name:'',who:empName(x.playerId),city:c?x.city:'all',conf:false});return}
    items.push({kind:'ev',id:x.id,date:x.date,start:x.start||'',end,color:evType(x.type).color,type:evType(x.type).name,
      title:x.clientId&&S.clients[x.clientId]?S.clients[x.clientId].name:(x.title||''),who:empName(x.playerId),city:x.city,conf:conflictsOf(x,all.filter(y=>y.type!=='slot')).length>0,comment:x.comment||''})});
  const live=id=>id&&S.sched[id]&&(sessLive(S.sched[id])||(S.sched[id].type==='slot'&&!S.sched[id].deleted&&slotOwner(S.sched[id])));
  liveClients().filter(c=>!c.archived&&pf.cl(c)).forEach(c=>{
    if(!live(c.sessionId)&&!live(c.slotId)&&c.examDate&&c.examDate>=from&&c.examDate<=to)items.push({kind:'exam',id:c.id,date:c.examDate,start:c.examTime||'',end:'',color:EXAM_COLOR,type:'Экзамен '+(c.exam==='Другое'&&c.examOther?c.examOther:c.exam||''),title:c.name,who:[empName(c.techId),empName(c.teacherId)].filter(x=>x!=='—').join(' + '),city:c.city,conf:false});
    const r=c.retake;
    if(r&&!live(r.sessionId)&&!live(r.slotId)&&r.date&&r.date>=from&&r.date<=to)items.push({kind:'exam',id:c.id,date:r.date,start:r.time||'',end:'',color:RETAKE_COLOR,type:'Пересдача',title:c.name,who:[empName(c.techId),empName(c.teacherId)].filter(x=>x!=='—').join(' + '),city:c.city,conf:false});
  });
  return items.sort((a,b)=>(a.date+(a.start||'99')).localeCompare(b.date+(b.start||'99')));
}
function whereText(e){if(!e)return '';const out=[];
  const tc=CITIES.filter(c=>hasRole(e,c.id,'teacher'));const hc=CITIES.filter(c=>hasRole(e,c.id,'tech'));
  if(tc.length)out.push('учитель: '+(tc.length===3?'все города':tc.map(c=>c.name).join(', ')));
  if(hc.length)out.push('тех: '+(hc.length===3?'все города':hc.map(c=>c.name).join(', ')));

      F.payPlan=planOf(F);F.payParts=partsOf(F);if(F.payPlan!=='custom')F.paidPct=pctFromParts(F.payPlan,F.payParts);

function viewSchedule(){
