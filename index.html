async function saveEvent(){
  const x=EV;if(!x)return;
  if(!x.date){toast('Укажите дату');return}if(!x.start){toast('Укажите время начала');return}
  if(!x.playerId&&!x.clientId&&!String(x.title||'').trim()){toast('Выберите, кто ведёт, или клиента');return}
  const base={type:x.type,start:x.start,dur:Math.max(5,num(x.dur)),city:x.city,playerId:x.playerId||'',clientId:x.clientId||'',title:x.clientId?'':String(x.title||'').trim(),comment:String(x.comment||'').trim(),deleted:false,updatedAt:nowIso(),updatedBy:S.uid||''};
  const old=x.id?S.sched[x.id]:null;
  closeModal();
  try{
    if(old){const {id:_omit,...rest}=old;await setDoc(BASE+'/schedule/'+x.id,{...rest,...base,date:x.date});toast('Сохранено');return}
    const dates=[x.date];
    if(x.repeat&&x.until>x.date){let d=x.date;for(let i=0;i<25;i++){d=addDays(d,7);if(d>x.until)break;dates.push(d)}}
    const seriesId=dates.length>1?'s'+Date.now().toString(36):'';
    for(const d of dates){await setDoc(BASE+'/schedule/'+newId('schedule'),{...base,date:d,seriesId,createdAt:nowIso(),createdBy:S.uid||''})}
    toast(dates.length>1?'Добавлено занятий: '+dates.length:'Занятие добавлено');
  }catch(e){}
}
async function deleteEvent(id){
  const ev=S.sched[id];if(!ev)return;
  let ids=[id];
  if(ev.seriesId){
    const rest=liveSched().filter(x=>x.seriesId===ev.seriesId&&x.date>=ev.date).sort((a,b)=>a.date.localeCompare(b.date));
    const choice=await new Promise(res=>{const m=openModal(`<div class="mh"><h2>Удалить занятие?</h2></div><div class="mb"><p style="margin:0">Это занятие из повторяющейся серии.</p></div>
      <div class="mf"><button class="btn" data-a="one">Только это</button>${rest.length>1?`<button class="btn" data-a="all" style="color:var(--danger)">Это и следующие (${rest.length})</button>`:''}<div class="grow"></div><button class="btn ghost" data-a="">Отмена</button></div>`,{cls:'narrow',onClose:()=>res('')});
      $$('[data-a]',m).forEach(b=>b.onclick=()=>{const s=modalStack[modalStack.length-1];s.onClose=null;closeModal();res(b.dataset.a)})});
    if(!choice)return;if(choice==='all')ids=rest.map(x=>x.id);
  }else if(!await ask('Удалить занятие?',esc(evType(ev.type).name)+', '+dshow(ev.date)+' '+esc(ev.start)))return;
  closeModal();
  try{for(const i of ids)await updDoc(BASE+'/schedule/'+i,{deleted:true});
    toast(ids.length>1?'Удалено занятий: '+ids.length:'Занятие удалено',async()=>{for(const i of ids)await updDoc(BASE+'/schedule/'+i,{deleted:false})})}catch(e){}
}
function schedClick(e){
  const t=e.target.closest('[data-sact],[data-wk],[data-smode],[data-ev],[data-addday],[data-addslot],[data-slot],[data-sess],[data-addq]');if(!t)return false;const d=t.dataset;
  if(d.sact==='new'){openEvent(null);return true}
  if(d.sact==='slots'){openSlots();return true}
  if(d.sact==='quick'){openQuickBook();return true}
  if(d.addq){openQuickBook(d.addq);return true}
  if(d.slot){openSlot(d.slot);return true}
  if(d.sess){openSession(d.sess);return true}
  if(d.addslot){openSlots(d.addslot);return true}
  if(d.wk!==undefined){S.sch.week=d.wk==='0'?mondayOf(today()):addDays(S.sch.week,7*Number(d.wk));render();return true}
  if(d.smode){S.sch.mode=d.smode;render();return true}
  if(d.ev){openEvent(d.ev);return true}
  if(d.addday){openEvent(null,d.addday);return true}
  return false;
}
function bindSchedule(v){
  const on=(id,fn)=>{const el=$('#'+id,v);if(el)el.onchange=()=>fn(el)};
  on('sch-city',el=>{S.sch.city=el.value;render()});
  on('sch-player',el=>{S.sch.player=el.value;render()});
  on('sch-mine',el=>{S.sch.mine=el.checked;render()});
  on('sch-slots',el=>{S.sch.slots=el.checked;render()});
}

/* ===== ЭКСПОРТ ===== */
let xlsxLoading=null,pdfLoading=null;
async function saveFile(filename,data){
  try{const blob=data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}catch(e){toast('Не удалось сохранить файл')}
}
async function exportTable(name,headers,rows,fmt){
  if(fmt==='csv'){const q=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
    return saveFile(name+'.csv','﻿'+[headers,...rows].map(r=>r.map(q).join(';')).join('\n'))}
  if(fmt==='xlsx'){
    if(!window.XLSX){xlsxLoading=xlsxLoading||loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');try{await xlsxLoading}catch(e){toast('Не удалось загрузить модуль Excel');return}}
    const ws=XLSX.utils.aoa_to_sheet([headers,...rows]);ws['!cols']=headers.map((h,i)=>({wch:Math.max(10,String(h).length+2,...rows.map(r=>String(r[i]??'').length+2))}));
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Данные');
    return saveFile(name+'.xlsx',new Blob([XLSX.write(wb,{type:'array',bookType:'xlsx'})]));
  }
  if(fmt==='pdf')return exportPdf(name,headers,rows);
}
async function exportPdf(name,headers,rows){
  if(!window.jspdf){pdfLoading=pdfLoading||loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');try{await pdfLoading}catch(e){toast('Не удалось загрузить модуль PDF');return}}
  try{await document.fonts.ready}catch(e){}
  const W=1700,H=1200,pad=60,rh=40,sc=1;const title=name.replace(/_/g,' ');
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');
  g.font='500 22px Inter, sans-serif';
  const colW=headers.map((h,i)=>Math.max(g.measureText(h).width,...rows.map(r=>g.measureText(String(r[i]??'')).width))+36);
  const sumW=colW.reduce((a,b)=>a+b,0);const k=Math.min(1,(W-2*pad)/sumW);const cw=colW.map(w=>w*k);
  const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  const per=Math.floor((H-2*pad-110)/rh);let page=0;
  for(let s=0;s<Math.max(rows.length,1);s+=per){
    g.fillStyle='#fff';g.fillRect(0,0,W,H);g.fillStyle='#1D2230';g.font='800 34px Inter, sans-serif';g.fillText(title,pad,pad+30);
    g.font='400 20px Inter, sans-serif';g.fillStyle='#8B92A1';g.fillText('Vanguard · '+dshow(today()),pad,pad+62);
    let y=pad+110;g.font='600 '+(20*k>14?20:Math.max(14,20*k))+'px Inter, sans-serif';g.fillStyle='#5B6272';
    let x=pad;headers.forEach((h,i)=>{const num_=i>0&&typeof rows[0]?.[i]==='number';g.textAlign=num_?'right':'left';g.fillText(h,num_?x+cw[i]-12:x+8,y);x+=cw[i]});
    g.fillStyle='#1D2230';g.font='400 '+Math.max(14,20*k)+'px Inter, sans-serif';
    rows.slice(s,s+per).forEach((r,ri)=>{y+=rh;g.strokeStyle='#E7E9EE';g.beginPath();g.moveTo(pad,y-rh+12);g.lineTo(W-pad,y-rh+12);g.stroke();
      const last=s+ri===rows.length-1&&String(r[0]).startsWith('Итого');g.font=(last?'700 ':'400 ')+Math.max(14,20*k)+'px Inter, sans-serif';
      let x=pad;r.forEach((v,i)=>{const isN=typeof v==='number';g.textAlign=isN?'right':'left';g.fillText(isN?nfmt(v):String(v??''),isN?x+cw[i]-12:x+8,y);x+=cw[i]})});
    g.textAlign='left';
    if(page>0)pdf.addPage();pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,842,842*H/W);page++;
  }
  return saveFile(name+'.pdf',pdf.output('blob'));
}
function exportClients(fmt){
  const city=S.route;const list=liveClients().filter(c=>clientMatches(c,city));const own=isOwner();const me=myEmp();
  const rows=clientRows(list).map(({c,r,teacher,tech,sales,extra})=>own?[c.name,c.exam==='Другое'?c.examOther:c.exam,CITY_NAME[c.city],c.examDate,c.payDate,statusById(c.status).name,r.cost,r.pct,r.paid,r.refund,r.revenue,empName(c.teacherId),teacher,empName(c.techId),tech,empName(c.soldBy),sales,extra,r.expense,r.vanguard,c.level||'',c.target||'',c.deadline||'',c.closed?c.closed.score:'',closedOutcome(c)==='good'?'доволен':closedOutcome(c)==='bad'?'возврат':'',c.comment||'']
    :[c.name,c.exam,CITY_NAME[c.city],c.examDate,statusById(c.status).name,r.cost,r.pct,empName(c.teacherId),empName(c.techId),me?(r.byEmp[me.id]||0):0]);
  const h=own?['Клиент','Экзамен','Город','Дата экзамена','Дата оплаты','Статус','Стоимость','% оплаты','Оплачено','Возврат','Выручка','Учитель','Доля учителя','Тех специалист','Доля тех','Продажа от','Доля продажи','Доплаты','Расходы','Итого Vanguard','Уровень','Нужный балл','Дедлайн','Набрал баллов','Итог','Комментарий']
    :['Клиент','Экзамен','Город','Дата экзамена','Статус','Стоимость','% оплаты','Учитель','Тех специалист','Ваша доля'];
  exportTable('Клиенты_'+(CITY_NAME[city]||'Все')+'_'+today(),h,rows,fmt);
}
function exportPayouts(fmt){
  const key=S.pay.period;const L=ledger();
  const rows=liveEmps().map(e=>payRow(key,e.id,L)).filter(r=>r.total||r.paid).map(r=>{const p=paymentsOf(key,r.empId);return [empName(r.empId),r.base.byRole.teacher,r.base.byRole.tech,r.base.byRole.sales,r.base.byRole.extra,r.corrSum,r.total,r.paid,r.due,p.length?dshow(p[p.length-1].date):'']});
  const tot=['Итого',...[1,2,3,4,5,6,7,8].map(i=>rows.reduce((a,r)=>a+r[i],0)),''];
  exportTable('Выплаты_'+periodLabel(key).replace(/\s/g,'_'),['Игрок','Как учитель','Как тех','За продажи','Доплаты','Корректировки','Итого','Выплачено','К выплате','Дата выплаты'],[...rows,tot],fmt);
}

/* ===== обработчики ===== */
function bindView(r){
  const v=$('#view');
  v.onclick=async e=>{
    if((r==='schedule'||r==='me')&&schedClick(e))return;
    if(e.target.closest('[data-act="myFree"]')){const m=myEmp();openSlots(null,m&&m.id);return}
    const t=e.target.closest('[data-act],[data-mode],[data-cid],[data-emp-edit],[data-emp-del],[data-emp-card],[data-staff],[data-pay],[data-pay-open],[data-unpay],[data-anmode],[data-anser],[data-exp],[data-rule-edit],[data-rule-del],[data-st-up],[data-st-del],[data-seg] button');
    if(!t)return;const d=t.dataset;
    if(d.unpay!==undefined){e.preventDefault();e.stopPropagation();return unpay(S.pay.period,d.unpay,Number(d.i))}
    if(d.act==='newClient'){if(!liveEmps().length){toast('Сначала добавьте игроков');location.hash='staff';return}return openClient(null)}
    if(d.act==='clearF'){S.f={q:'',exam:'',status:'',emp:'',from:'',to:'',arch:false};return render()}
    if(d.act==='exportClients')return exportClients(d.fmt);
    if(d.act==='newEmp')return openEmp(null);
    if(d.act==='payAll')return payDialog(liveEmps().map(x=>x.id),S.pay.period);
    if(d.act==='payExport')return exportPayouts(d.fmt);
    if(d.act==='newExp')return openExp(null);
    if(d.act==='clearExp'){S.exp={month:'',city:''};return render()}
    if(d.act==='expExport'){const list=Object.values(S.expenses).filter(x=>!x.deleted&&(!S.exp.month||String(x.date).startsWith(S.exp.month))&&(!S.exp.city||x.city===S.exp.city));
      return exportTable('Расходы_'+today(),['Дата','На что','Город','Кто заплатил','Сумма'],list.map(x=>[x.date,x.what,CITY_NAME[x.city]||'',x.payerId?empName(x.payerId):x.payer,num(x.amount)]),'xlsx')}
    if(d.act==='newRule')return openRule(null);
    if(d.act==='addStatus'){const st=[...cfg().statuses,{id:'s'+Date.now().toString(36),name:'Новый статус',color:'#8FA3BF'}];return saveConfig({statuses:st})}
    if(d.mode){S.mode=d.mode;try{localStorage.setItem('vg-mode',d.mode)}catch(x){}return render()}
    if(d.cid&&!t.classList.contains('dragging'))return openClient(d.cid);
    if(d.empEdit)return openEmp(d.empEdit);
    if(d.empDel)return deleteEmp(d.empDel);
    if(d.empCard)return openEmpCard(d.empCard);
    if(d.staff){S.staff.show=d.staff;return render()}
    if(d.pay){e.stopPropagation();return payDialog([d.pay],S.pay.period)}
    if(d.payOpen){S.pay.open[d.payOpen]=!S.pay.open[d.payOpen];return render()}
    if(d.anmode){S.an.mode=d.anmode;return render()}
    if(d.anser){S.an.series=d.anser;return render()}
    if(d.exp)return openExp(d.exp);
    if(d.ruleEdit)return openRule(d.ruleEdit);
    if(d.ruleDel){const rules=cfg().rules;const rr=rules.find(x=>x.id===d.ruleDel);if(!await ask('Удалить правило?','Сохранённые клиенты не изменятся.'))return;
      await saveConfig({rules:rules.filter(x=>x.id!==d.ruleDel)});return toast('Правило удалено',()=>saveConfig({rules:[...cfg().rules,rr]}))}
    if(d.stUp){const st=[...cfg().statuses];const i=Number(d.stUp);[st[i-1],st[i]]=[st[i],st[i-1]];return saveConfig({statuses:st})}
    if(d.stDel){const st=[...cfg().statuses];const rm=st.splice(Number(d.stDel),1)[0];await saveConfig({statuses:st});return toast('Статус удалён',()=>saveConfig({statuses:[...cfg().statuses,rm]}))}
    const sg=t.closest('[data-seg]');if(sg&&sg.dataset.seg==='sessmin'){return saveConfig({sessionMin:Number(t.dataset.v)}).then(()=>toast('Сохранено'))}
    if(sg&&sg.dataset.seg==='accrual'){if(t.dataset.v!==cfg().accrual)return saveConfig({accrual:t.dataset.v}).then(()=>toast('Сохранено'))}
  };
  if(r==='schedule')bindSchedule(v);
  const on=(sel,ev,fn)=>{const el=$(sel,v);if(el)el[ev]=fn};
  on('#f-q','oninput',e=>{S.f.q=e.target.value;schedule()});
  $$('[data-f]',v).forEach(el=>el.onchange=()=>{const k=el.dataset.f;S.f[k]=el.type==='checkbox'?el.checked:el.value;render()});
  on('#pay-period','onchange',e=>{S.pay.period=e.target.value;S.pay.open={};render()});
  on('#an-city','onchange',e=>{S.an.city=e.target.value;render()});
  on('#an-period','onchange',e=>{S.an.period=e.target.value;render()});
  on('#an-month','onchange',e=>{S.an.month=e.target.value;render()});
  on('#an-from','onchange',e=>{S.an.from=e.target.value;render()});
  on('#an-to','onchange',e=>{S.an.to=e.target.value;render()});
  on('#exp-month','onchange',e=>{S.exp.month=e.target.value;render()});
  on('#exp-city','onchange',e=>{S.exp.city=e.target.value;render()});
  $$('[data-rule-on]',v).forEach(el=>el.onchange=()=>{const rules=cfg().rules.map(x=>x.id===el.dataset.ruleOn?{...x,enabled:el.checked}:x);saveConfig({rules})});
  $$('[data-st-name]',v).forEach(el=>el.onchange=()=>{const st=cfg().statuses.map((s,i)=>i===Number(el.dataset.stName)?{...s,name:el.value.trim()||s.name}:s);saveConfig({statuses:st}).then(()=>toast('Статус переименован'))});
  $$('[data-st-color]',v).forEach(el=>el.onchange=()=>{const st=cfg().statuses.map((s,i)=>i===Number(el.dataset.stColor)?{...s,color:el.value}:s);saveConfig({statuses:st})});
  // drag & drop
  const board=$('#board',v);
  if(board&&S.canWrite){
    let dragId=null;
    board.ondragstart=e=>{const c=e.target.closest('.kcard');if(!c)return;dragId=c.dataset.cid;c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}};
    board.ondragend=e=>{$$('.kcard.dragging',board).forEach(x=>x.classList.remove('dragging'));$$('.col.drop',board).forEach(x=>x.classList.remove('drop'))};
    board.ondragover=e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();$$('.col.drop',board).forEach(x=>x!==col&&x.classList.remove('drop'));col.classList.add('drop')};
    board.ondrop=e=>{const col=e.target.closest('.col');if(!col||!dragId)return;e.preventDefault();const id=dragId;dragId=null;setClientStatus(id,col.dataset.col)};
  }
}

/* ===== запуск ===== */
async function init(){
  try{const m=localStorage.getItem('vg-mode');if(m)S.mode=m}catch(e){}
  if(!window.supabase||SUPABASE_URL.startsWith('__')){$('#view').innerHTML='<div class="card empty"><b>Сайт ещё не подключён к базе</b>Впишите адрес и ключ Supabase в начало файла.</div>';return}
  SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
  const {data:{session}}=await SB.auth.getSession();
  if(!session){showLogin();return}
  SB.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')location.reload()});
  const st=makeStore(SB);S.db=st.db;S.uid=session.user.id;S.email=(session.user.email||'').toLowerCase();S.ownerAcc=false;
  const col=(name,key)=>S.db.collection(BASE+'/'+name).onSnapshot(snap=>{const o={};snap.docs.forEach(d=>o[d.id]={id:d.id,...d.data()});S[key]=o;S.got[key]=true;S.fresh[key]=true;schedule();afterData()});
  col('employees','emps');col('clients','clients');col('expenses','expenses');col('periods','periods');col('payments','payments');col('viewers','viewers');col('schedule','sched');
  S.db.doc(BASE+'/config/app').onSnapshot(d=>{S.config=d.exists?d.data():null;S.got.config=true;S.fresh.config=true;schedule();afterData()});
  try{await st.loadAll()}catch(e){
    if(e&&e.code==='invalid_argument'){await SB.auth.signOut();return}
    $('#view').innerHTML='<div class="card empty"><b>Не удаётся связаться с базой</b>Проверьте интернет и обновите страницу.</div>';return}
  st.startRealtime();
  $('#logout').classList.remove('hide');
}
let viewerDone=false;
function afterData(){
  if(!viewerDone&&S.uid&&S.fresh.viewers&&S.canWrite){viewerDone=true;const v=S.viewers[S.uid];const d=today();
    const login=emailToLogin(S.email);
    if(!v)setDoc(BASE+'/viewers/'+S.uid,{firstSeen:nowIso(),lastSeen:d,login}).catch(()=>{});
    else if(v.lastSeen!==d||v.login!==login)updDoc(BASE+'/viewers/'+S.uid,{lastSeen:d,login}).catch(()=>{})}
  autoLink();
  expireOffers();
  setTimeout(maybeFreeze,1500);
}
const expiring=new Set();
async function expireOffers(){
  if(!S.canWrite||!S.fresh.clients)return;
  for(const c of liveClients().filter(offerExpired)){
    if(expiring.has(c.id))continue;expiring.add(c.id);
    try{for(const x of c.offers||[])if(x.sessionId&&S.sched[x.sessionId]&&!S.sched[x.sessionId].deleted)await updDoc(BASE+'/schedule/'+x.sessionId,{deleted:true});
      await updDoc(BASE+'/clients/'+c.id,{status:'bron',offers:[],offerExpires:'',offerExpiredAt:nowIso(),
        history:[...(c.history||[]),{at:nowIso(),by:'',action:'клиент не подтвердил дату за '+HOLD_HOURS+' ч — варианты освобождены, карточка вернулась в «Бронь»'}].slice(-60)})}catch(e){}
  }
}
setInterval(()=>{if(S.db){expireOffers();if(S.route&&document.visibilityState==='visible'&&!modalStack.length)schedule()}},60000);
/* Привязка аккаунта к игроку по email */
const linkTried=new Set();
function autoLink(){
  if(!S.uid||!S.email||!S.fresh.emps||!S.canWrite||myEmp())return;
  const e=liveEmps().find(x=>(x.email||'').toLowerCase()===S.email&&!x.userId);
  if(!e||linkTried.has(e.id))return;linkTried.add(e.id);
  updDoc(BASE+'/employees/'+e.id,{userId:S.uid}).then(()=>toast('Вы вошли как '+e.name)).catch(()=>{});
}
function noAccess(){
  return `<div class="card empty" style="max-width:560px;margin:40px auto"><b>Доступ ещё не настроен</b>
   <p>Вы вошли под логином <b>${esc(emailToLogin(S.email))}</b>, но он пока не указан ни у одного игрока Vanguard.</p>
   <p class="small">Попросите тренера вписать этот логин в вашу карточку в разделе «Игроки», затем обновите страницу.</p>
   <button class="btn" onclick="SB.auth.signOut()">Выйти</button></div>`;
}
function bindNoAccess(){}
init();
